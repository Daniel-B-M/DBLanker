services:
  postgres:
    image: postgres:17-alpine
    container_name: dblanker-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: dblanker
      POSTGRES_PASSWORD: dblanker_dev
      POSTGRES_DB: dblanker

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - dblanker_postgres_data:/var/lib/postgresql/data

volumes:
  dblanker_postgres_data: